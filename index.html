<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RideTracker - Driver GPS Broadcaster</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appbg: '#0a0f1d',
            appcard: '#101728',
            appborder: '#1e2942',
            brandblue: '#2563eb',
            brandemerald: '#10b981',
            branddanger: '#e11d48'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0a0f1d;
    }

    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
      background: #060913;
    }

    /* CRITICAL DARK MODE OSM MAP FILTER HACK (100% FREE - NO API KEYS) */
    .dark .leaflet-tile {
      filter: brightness(0.85) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }

    /* Custom Leaflet Zoom Controls */
    .leaflet-control-zoom {
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6) !important;
    }
    .leaflet-control-zoom a {
      background-color: #121a2d !important;
      color: #cbd5e1 !important;
      border-bottom: 1px solid #1e2942 !important;
      width: 36px !important;
      height: 36px !important;
      line-height: 36px !important;
    }
    .leaflet-control-zoom a:hover {
      background-color: #1e2942 !important;
      color: #ffffff !important;
    }
    .leaflet-control-attribution {
      display: none !important;
    }

    /* Glowing Car Pulse Marker */
    .car-marker-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      transition: transform 0.35s cubic-bezier(0.2, 0, 0.2, 1);
    }
    .car-halo-ring {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(16, 185, 129, 0) 70%);
      border: 1.5px solid rgba(16, 185, 129, 0.8);
      animation: carPulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .car-core-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
      border: 2px solid #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #34d399;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
      z-index: 2;
    }
    @keyframes carPulse {
      0% { transform: scale(0.8); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.3; }
      100% { transform: scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body class="bg-appbg text-slate-100 flex flex-col h-screen w-screen overflow-hidden select-none">

  <!-- TOP APP HEADER -->
  <header class="h-16 bg-[#0d1424] border-b border-appborder/80 px-4 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/25">
        <i class="fa-solid fa-paper-plane text-white text-base -rotate-45 transform ml-0.5 mt-0.5"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-black text-lg tracking-tight leading-none text-white">RideTracker</h1>
          <span id="gpsLiveBadge" class="px-2 py-0.5 text-[10px] font-black uppercase rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 tracking-wider">
            GPS LIVE
          </span>
        </div>
        <p class="text-xs text-slate-400 font-medium mt-0.5">Driver • <span id="headerTripId">trip_101</span></p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="openTripPrompt()" class="w-10 h-10 rounded-xl bg-[#172136] hover:bg-[#202d49] border border-appborder text-slate-300 hover:text-white flex items-center justify-center transition" title="Change Trip ID">
        <i class="fa-solid fa-gear text-sm"></i>
      </button>
      <a href="customer.html" class="h-10 px-3.5 rounded-xl bg-[#172136] hover:bg-[#202d49] border border-appborder text-slate-200 hover:text-white font-semibold text-xs flex items-center gap-2 transition">
        <i class="fa-solid fa-right-left text-xs text-cyan-400"></i>
        <span>Switch Mode</span>
      </a>
    </div>
  </header>

  <!-- SUB-BAR: BROADCAST PILLS & ACTIONS -->
  <section class="h-12 bg-[#090e1a]/95 border-b border-appborder/60 px-4 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2">
      <div id="statusPill" class="px-3.5 py-1.5 rounded-full bg-[#121b2f] border border-appborder text-xs font-semibold text-slate-200 flex items-center gap-2">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="statusPillText">Live Broadcasting</span>
      </div>

      <button onclick="openTripPrompt()" class="px-3.5 py-1.5 rounded-full bg-[#121b2f] hover:bg-[#1a2640] border border-appborder text-xs font-mono font-bold text-emerald-400 flex items-center gap-1.5 transition">
        <span class="text-slate-500">#</span>
        <span id="pillTripId">trip_101</span>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="shareTrackingLink()" class="w-9 h-9 rounded-xl bg-[#121b2f] hover:bg-[#1a2640] border border-appborder text-slate-300 hover:text-white flex items-center justify-center transition" title="Share Tracking Link">
        <i class="fa-solid fa-share-nodes text-xs"></i>
      </button>
      <button onclick="centerMapOnDriver()" class="w-9 h-9 rounded-xl bg-[#121b2f] hover:bg-[#1a2640] border border-appborder text-slate-300 hover:text-emerald-400 flex items-center justify-center transition" title="Recenter on My Location">
        <i class="fa-solid fa-crosshairs text-xs"></i>
      </button>
    </div>
  </section>

  <!-- GPS ERROR / ALERT BANNER -->
  <div id="gpsAlertBanner" class="hidden bg-rose-950/95 border-b border-rose-600/60 px-4 py-2.5 z-40 text-rose-200 text-xs flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <i class="fa-solid fa-triangle-exclamation text-rose-400 text-base shrink-0"></i>
      <span id="gpsAlertMessage">Location permission required. Please enable GPS.</span>
    </div>
    <button onclick="initGps()" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-[11px] shrink-0">
      Retry GPS
    </button>
  </div>
  <!-- MAP CANVAS -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>
  </main>

  <!-- BOTTOM CONTROL PANEL -->
  <footer class="bg-[#0b1120] border-t border-appborder px-4 pt-3.5 pb-4 z-30 shrink-0 space-y-3">
    
    <!-- Big Action Button (Stop/Start GPS Broadcasting) -->
    <button id="toggleBroadcastBtn" onclick="toggleGpsBroadcasting()"
      class="w-full py-3.5 px-4 rounded-2xl font-black text-sm tracking-wide text-white bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 shadow-xl shadow-rose-600/25 flex items-center justify-center gap-2.5 transition active:scale-[0.99]">
      <i id="broadcastBtnIcon" class="fa-solid fa-stop text-sm"></i>
      <span id="broadcastBtnText">Stop GPS Broadcasting</span>
    </button>

    <!-- 2x2 Stats Grid -->
    <div class="grid grid-cols-2 gap-2.5">
      
      <!-- LATITUDE -->
      <div class="bg-[#101728] border border-appborder/90 rounded-2xl p-3">
        <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">LATITUDE</div>
        <div id="valLatitude" class="font-mono font-black text-lg text-white tracking-tight">--.------</div>
      </div>

      <!-- LONGITUDE -->
      <div class="bg-[#101728] border border-appborder/90 rounded-2xl p-3">
        <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">LONGITUDE</div>
        <div id="valLongitude" class="font-mono font-black text-lg text-white tracking-tight">--.------</div>
      </div>

      <!-- REAL SPEED -->
      <div class="bg-[#101728] border border-appborder/90 rounded-2xl p-3">
        <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">REAL SPEED</div>
        <div class="flex items-baseline gap-1">
          <span id="valSpeed" class="font-mono font-black text-lg text-emerald-400">0</span>
          <span class="text-xs font-bold text-slate-400">km/h</span>
        </div>
      </div>

      <!-- GPS PRECISION -->
      <div class="bg-[#101728] border border-appborder/90 rounded-2xl p-3">
        <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">GPS PRECISION</div>
        <div class="flex items-baseline gap-1">
          <span id="valAccuracy" class="font-mono font-black text-lg text-cyan-400">±--</span>
          <span class="text-xs font-bold text-slate-400">m</span>
        </div>
      </div>
    </div>

    <!-- Status Footer Bar -->
    <div class="flex items-center justify-between text-[11px] font-medium text-slate-400 pt-1">
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-cloud text-emerald-400"></i>
        <span>Firestore Updates: <b id="valUpdatesCount" class="text-slate-200 font-mono">0</b></span>
      </div>
      <div class="flex items-center gap-1.5 font-mono">
        <i class="fa-regular fa-clock text-slate-500"></i>
        <span>Last Sync: <span id="valLastSync" class="text-slate-300">--:--:--</span></span>
      </div>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full"></div>
  <!-- FIREBASE MODULAR SDK (v10) & SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 1. EXACT FIREBASE CONFIGURATION
    const fbConf = {
      apiKey: "AIzaSyC_bj_Jxhi0ZzS_w4kkSv8Rn2GPRPx5H6o",
      authDomain: "adarsh-bal-vidya-mandir-d0bf9.firebaseapp.com",
      projectId: "adarsh-bal-vidya-mandir-d0bf9",
      storageBucket: "adarsh-bal-vidya-mandir-d0bf9.firebasestorage.app",
      messagingSenderId: "533739162741",
      appId: "1:533739162741:web:ca2cef802f5ba6588ebc3c"
    };

    const app = initializeApp(fbConf);
    const db = getFirestore(app);

    // 2. APP STATE
    const STATE = {
      tripId: 'trip_101',
      isBroadcasting: true,
      watchId: null,
      wakeLock: null,
      updatesCount: 0,
      lastCoords: null,
      polylineCoords: []
    };

    // 3. MAP OBJECTS
    let map = null;
    let carMarker = null;
    let accuracyCircle = null;
    let routePolyline = null;

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const colors = {
        success: 'border-emerald-500/60 bg-[#0f1d24]',
        error: 'border-rose-500/60 bg-[#240f14]',
        warning: 'border-amber-500/60 bg-[#241a0f]',
        info: 'border-blue-500/60 bg-[#0f172a]'
      };
      const icons = {
        success: 'fa-circle-check text-emerald-400',
        error: 'fa-circle-xmark text-rose-400',
        warning: 'fa-triangle-exclamation text-amber-400',
        info: 'fa-circle-info text-cyan-400'
      };

      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border ${colors[type] || colors.info} shadow-2xl flex items-center gap-3 text-xs text-white transform transition-all duration-300 translate-y-2 opacity-0`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-base shrink-0"></i>
        <span class="font-medium">${msg}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = (lat1 * Math.PI) / 180;
      const phi2 = (lat2 * Math.PI) / 180;
      const dPhi = ((lat2 - lat1) * Math.PI) / 180;
      const dLam = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(dLam / 2) * Math.sin(dLam / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const phi1 = (lat1 * Math.PI) / 180;
      const phi2 = (lat2 * Math.PI) / 180;
      const dLam = ((lon2 - lon1) * Math.PI) / 180;
      const y = Math.sin(dLam) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) -
                Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLam);
      return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
    }

    function createCarIconHtml(heading = 0) {
      return `
        <div class="car-marker-container" style="transform: rotate(${heading}deg);">
          <div class="car-halo-ring"></div>
          <div class="car-core-badge">
            <i class="fa-solid fa-car-side text-sm"></i>
          </div>
        </div>
      `;
    }

    function initMap() {
      if (map) return;

      map = L.map('map', {
        zoomControl: true,
        attributionControl: false
      }).setView([20.5937, 78.9629], 5);

      // STRICTLY OPENSTREETMAP TILE URL
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      routePolyline = L.polyline([], {
        color: '#10b981',
        weight: 4,
        opacity: 0.9,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          STATE.wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {
        console.warn('WakeLock not granted:', e);
      }
    }

    // PERFECT GPS ENGINE
    window.initGps = function() {
      if (!navigator.geolocation) {
        showGpsBanner("Your browser does not support Geolocation.");
        return;
      }

      hideGpsBanner();
      requestWakeLock();
      showToast("Acquiring GPS satellite lock...", "info");

      // 1. Quick low-accuracy initial position to warm up mobile GPS
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          handleGpsSuccess(pos);
          startContinuousWatch();
        },
        (err) => {
          console.warn("Initial quick GPS failed, falling back to watchPosition:", err);
          startContinuousWatch();
        },
        { enableHighAccuracy: false, timeout: 7000, maximumAge: 30000 }
      );
    };

    function startContinuousWatch() {
      if (STATE.watchId !== null) {
        navigator.geolocation.clearWatch(STATE.watchId);
      }

      // 2. Continuous high accuracy watchPosition
      const options = {
        enableHighAccuracy: true,
        timeout: 30000,
        maximumAge: 0
      };

      STATE.watchId = navigator.geolocation.watchPosition(
        handleGpsSuccess,
        handleGpsError,
        options
      );
    }

    async function handleGpsSuccess(pos) {
      hideGpsBanner();
      const coords = pos.coords;
      const lat = coords.latitude;
      const lng = coords.longitude;
      const accuracy = coords.accuracy || 10;
      let rawSpeed = coords.speed;
      let heading = coords.heading;

      let speedKmH = (rawSpeed !== null && !isNaN(rawSpeed) && rawSpeed > 0) ? (rawSpeed * 3.6) : 0;

      if (STATE.lastCoords) {
        const dist = getDistanceMeters(STATE.lastCoords.lat, STATE.lastCoords.lng, lat, lng);
        if (dist >= 1.5) {
          if (heading === null || isNaN(heading)) {
            heading = calculateBearing(STATE.lastCoords.lat, STATE.lastCoords.lng, lat, lng);
          }
          if (speedKmH === 0 && pos.timestamp && STATE.lastCoords.timestamp) {
            const dtSec = (pos.timestamp - STATE.lastCoords.timestamp) / 1000;
            if (dtSec > 0 && dtSec < 15) {
              const calcSpeed = (dist / dtSec) * 3.6;
              if (calcSpeed > 0.5 && calcSpeed < 180) speedKmH = calcSpeed;
            }
          }
        } else {
          heading = STATE.lastCoords.heading || 0;
        }
      }

      heading = heading ? Math.round(heading) : 0;
      speedKmH = Math.round(speedKmH);

      STATE.lastCoords = {
        lat,
        lng,
        heading,
        speed: speedKmH,
        accuracy: Math.round(accuracy),
        timestamp: pos.timestamp || Date.now()
      };

      STATE.updatesCount++;

      updateHud(lat, lng, speedKmH, accuracy);
      updateMapMarker(lat, lng, heading, accuracy);

      if (STATE.isBroadcasting) {
        try {
          const tripRef = doc(db, "trips", STATE.tripId);
          await setDoc(tripRef, {
            tripId: STATE.tripId,
            driverLocation: {
              latitude: lat,
              longitude: lng,
              accuracy: Math.round(accuracy),
              speed: speedKmH,
              heading: heading
            },
            status: 'active',
            updatedAt: serverTimestamp(),
            lastSeenTimestamp: Date.now()
          }, { merge: true });

          const now = new Date();
          document.getElementById('valLastSync').innerText = now.toTimeString().split(' ')[0];
          document.getElementById('valUpdatesCount').innerText = STATE.updatesCount;
        } catch (err) {
          console.error("Firestore sync error:", err);
          showToast("Sync Error: " + err.message, "error");
        }
      }
    }

    function handleGpsError(err) {
      let msg = "GPS Signal Error.";
      if (err.code === 1) msg = "Location permission denied! Please allow location access in browser.";
      else if (err.code === 2) msg = "GPS unavailable. Move to an open area with clear sky.";
      else if (err.code === 3) msg = "GPS timeout. Reconnecting...";
      showGpsBanner(msg);
    }

    function updateHud(lat, lng, speed, accuracy) {
      document.getElementById('valLatitude').innerText = lat.toFixed(6);
      document.getElementById('valLongitude').innerText = lng.toFixed(6);
      document.getElementById('valSpeed').innerText = speed;
      document.getElementById('valAccuracy').innerText = `±${Math.round(accuracy)}`;
    }

    function updateMapMarker(lat, lng, heading, accuracy) {
      const latLng = [lat, lng];

      if (!carMarker) {
        const carIcon = L.divIcon({
          className: 'custom-car-div-icon',
          html: createCarIconHtml(heading),
          iconSize: [54, 54],
          iconAnchor: [27, 27]
        });
        carMarker = L.marker(latLng, { icon: carIcon }).addTo(map);
        map.setView(latLng, 17);
      } else {
        carMarker.setLatLng(latLng);
        const iconContainer = carMarker.getElement()?.querySelector('.car-marker-container');
        if (iconContainer) {
          iconContainer.style.transform = `rotate(${heading}deg)`;
        }
      }

      if (!accuracyCircle) {
        accuracyCircle = L.circle(latLng, {
          radius: accuracy,
          color: '#10b981',
          fillColor: '#10b981',
          fillOpacity: 0.12,
          weight: 1.5
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng(latLng);
        accuracyCircle.setRadius(accuracy);
      }

      STATE.polylineCoords.push(latLng);
      routePolyline.setLatLngs(STATE.polylineCoords);
    }

    function showGpsBanner(msg) {
      document.getElementById('gpsAlertMessage').innerText = msg;
      document.getElementById('gpsAlertBanner').classList.remove('hidden');
    }

    function hideGpsBanner() {
      document.getElementById('gpsAlertBanner').classList.add('hidden');
    }

    window.toggleGpsBroadcasting = function() {
      STATE.isBroadcasting = !STATE.isBroadcasting;
      const btn = document.getElementById('toggleBroadcastBtn');
      const btnIcon = document.getElementById('broadcastBtnIcon');
      const btnText = document.getElementById('broadcastBtnText');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusPillText');
      const gpsLiveBadge = document.getElementById('gpsLiveBadge');

      if (STATE.isBroadcasting) {
        btn.className = "w-full py-3.5 px-4 rounded-2xl font-black text-sm tracking-wide text-white bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 shadow-xl shadow-rose-600/25 flex items-center justify-center gap-2.5 transition active:scale-[0.99]";
        btnIcon.className = "fa-solid fa-stop text-sm";
        btnText.innerText = "Stop GPS Broadcasting";

        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
        statusText.innerText = "Live Broadcasting";
        statusText.className = "text-slate-200";
        gpsLiveBadge.className = "px-2 py-0.5 text-[10px] font-black uppercase rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 tracking-wider";
        showToast("GPS Broadcasting Resumed", "success");
      } else {
        btn.className = "w-full py-3.5 px-4 rounded-2xl font-black text-sm tracking-wide text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-xl shadow-emerald-600/25 flex items-center justify-center gap-2.5 transition active:scale-[0.99]";
        btnIcon.className = "fa-solid fa-play text-sm";
        btnText.innerText = "Start GPS Broadcasting";

        statusDot.className = "w-2 h-2 rounded-full bg-amber-400";
        statusText.innerText = "Broadcast Paused";
        statusText.className = "text-amber-300";
        gpsLiveBadge.className = "px-2 py-0.5 text-[10px] font-black uppercase rounded-md bg-amber-500/20 text-amber-400 border border-amber-500/40 tracking-wider";
        showToast("GPS Broadcasting Paused", "warning");
      }
    };

    window.centerMapOnDriver = function() {
      if (carMarker) {
        map.setView(carMarker.getLatLng(), 17, { animate: true });
        showToast("Centered on GPS location", "info");
      } else {
        showToast("Waiting for GPS lock...", "warning");
      }
    };

    window.shareTrackingLink = function() {
      const url = `${window.location.origin}${window.location.pathname.replace('driver.html', '')}customer.html?trip=${encodeURIComponent(STATE.tripId)}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          showToast("Customer Tracking Link Copied!", "success");
        }).catch(() => {
          prompt("Copy Customer Tracking Link:", url);
        });
      } else {
        prompt("Copy Customer Tracking Link:", url);
      }
    };

    window.openTripPrompt = function() {
      const newTrip = prompt("Enter Trip ID:", STATE.tripId);
      if (newTrip && newTrip.trim() !== '') {
        STATE.tripId = newTrip.trim();
        document.getElementById('headerTripId').innerText = STATE.tripId;
        document.getElementById('pillTripId').innerText = STATE.tripId;
        showToast(`Trip switched to: ${STATE.tripId}`, "info");
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const urlTrip = params.get('trip');
      if (urlTrip) {
        STATE.tripId = urlTrip;
      }
      document.getElementById('headerTripId').innerText = STATE.tripId;
      document.getElementById('pillTripId').innerText = STATE.tripId;

      initMap();
      initGps();
    });
  </script>
</body>
</html>
