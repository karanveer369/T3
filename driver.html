<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Driver - GPS Live Tracking</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script> tailwind.config = { darkMode: 'class' } </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    .leaflet-container { font-family: inherit; width: 100%; height: 100%; background: #090d16; }
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .car-marker-container { transition: transform 0.3s ease-out; transform-origin: center center; }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden select-none">

  <div class="h-full flex flex-col relative w-full overflow-hidden">
    <header class="z-30 bg-slate-900/95 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
          <i class="fa-solid fa-location-arrow text-base"></i>
        </div>
        <div>
          <h1 class="font-bold text-base text-white flex items-center gap-1.5">
            RideTracker <span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Driver</span>
          </h1>
          <p class="text-xs text-slate-400" id="headerSubtitle">GPS Broadcaster</p>
        </div>
      </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col">
      <!-- Setup Screen -->
      <section id="setupView" class="absolute inset-0 z-50 flex flex-col justify-center items-center p-4 bg-slate-950">
        <div class="glass-panel w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-5">
          <div class="text-center space-y-2">
            <h2 class="text-2xl font-extrabold text-white">Broadcast GPS</h2>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Trip ID</label>
            <input type="text" id="sessionTripInput" value="trip_101" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"/>
          </div>
          <button onclick="startApp()" class="w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg">
            Start Driver Mode
          </button>
        </div>
      </section>

      <!-- Dashboard -->
      <section id="driverView" class="hidden flex-1 flex flex-col relative h-full overflow-hidden">
        <div class="flex-1 relative w-full">
          <div id="driverMap" class="w-full h-full"></div>
          <div id="driverWaitingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-[1000] flex flex-col items-center justify-center text-center">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mb-3 animate-pulse">
              <i class="fa-solid fa-satellite-dish"></i>
            </div>
            <h3 class="text-lg font-bold text-white">Acquiring GPS Lock...</h3>
          </div>
        </div>

        <div class="bg-slate-900 border-t border-slate-800 p-4 shadow-2xl space-y-4">
          <button id="trackingToggleBtn" onclick="toggleTracking()" class="w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-emerald-600 flex justify-center gap-2">
            <i class="fa-solid fa-play" id="trackingBtnIcon"></i> <span id="trackingBtnText">Start Broadcasting</span>
          </button>
          <div class="grid grid-cols-3 gap-2.5 text-center">
            <div class="p-3 bg-slate-950/70 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 font-bold">Speed</span><p id="driverSpeedDisplay" class="text-sm font-mono text-emerald-400 mt-0.5">0 km/h</p></div>
            <div class="p-3 bg-slate-950/70 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 font-bold">Accuracy</span><p id="driverAccuracyDisplay" class="text-sm font-mono text-sky-400 mt-0.5">-- m</p></div>
            <div class="p-3 bg-slate-950/70 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 font-bold">Status</span><p id="driverStatusText" class="text-sm font-mono text-amber-400 mt-0.5">Paused</p></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const fbConf = {
      apiKey: "AIzaSyC_bj_Jxhi0ZzS_w4kkSv8Rn2GPRPx5H6o",
      authDomain: "adarsh-bal-vidya-mandir-d0bf9.firebaseapp.com",
      projectId: "adarsh-bal-vidya-mandir-d0bf9",
      storageBucket: "adarsh-bal-vidya-mandir-d0bf9.firebasestorage.app",
      messagingSenderId: "533739162741",
      appId: "1:533739162741:web:ca2cef802f5ba6588ebc3c"
    };

    let db = getFirestore(initializeApp(fbConf));
    let currentTripId = 'trip_101', isTracking = false, driverWatchId = null;
    let driverMap = null, driverMarker = null;

    const createCarIcon = (heading = 0) => L.divIcon({
      className: '',
      html: `<div class="car-marker-container" style="transform: rotate(${heading}deg);"><div class="relative w-10 h-10 flex items-center justify-center bg-slate-900 text-emerald-400 rounded-full border-2 border-emerald-400 shadow-xl"><i class="fa-solid fa-car-side text-base"></i></div></div>`,
      iconSize: [40, 40], iconAnchor: [20, 20]
    });

    window.startApp = function() {
      currentTripId = document.getElementById('sessionTripInput').value.trim() || 'trip_101';
      document.getElementById('setupView').classList.add('hidden');
      document.getElementById('driverView').classList.remove('hidden');
      setTimeout(() => {
        driverMap = L.map('driverMap', { zoomControl: false }).setView([26.9739, 81.9098], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(driverMap);
        window.toggleTracking();
      }, 100);
    };

    window.toggleTracking = function() {
      if (isTracking) {
        navigator.geolocation.clearWatch(driverWatchId);
        isTracking = false;
        document.getElementById('trackingToggleBtn').className = "w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-emerald-600 flex justify-center gap-2";
        document.getElementById('trackingBtnText').textContent = "Start Broadcasting";
        document.getElementById('driverStatusText').textContent = "Paused";
      } else {
        if (!navigator.geolocation) return alert("GPS not supported");
        isTracking = true;
        document.getElementById('trackingToggleBtn').className = "w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-rose-600 flex justify-center gap-2";
        document.getElementById('trackingBtnText').textContent = "Stop Broadcasting";
        document.getElementById('driverStatusText').textContent = "Broadcasting";
        startDriverGpsWatch();
      }
    };

    function startDriverGpsWatch() {
      driverWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          document.getElementById('driverWaitingOverlay').classList.add('hidden');
          handleUpdate(pos.coords.latitude, pos.coords.longitude, pos.coords.speed, pos.coords.accuracy, pos.coords.heading);
        },
        (err) => alert("GPS Error: " + err.message),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 }
      );
    }

    async function handleUpdate(lat, lng, speed, accuracy, heading) {
      let speedKmh = speed ? Math.round(speed * 3.6) : 0;
      
      // 🚀 SMART DEAD-ZONE FILTER (GPS Drift rokne ke liye)
      if (speedKmh < 3) speedKmh = 0;

      const accMeters = accuracy ? Math.round(accuracy) : 0;
      const currentLatLng = [lat, lng];

      document.getElementById('driverSpeedDisplay').textContent = `${speedKmh} km/h`;
      document.getElementById('driverAccuracyDisplay').textContent = `±${accMeters} m`;

      if (!driverMarker) {
        driverMarker = L.marker(currentLatLng, { icon: createCarIcon(heading || 0) }).addTo(driverMap);
        driverMap.setView(currentLatLng, 17);
      } else {
        driverMarker.setLatLng(currentLatLng);
        driverMarker.setIcon(createCarIcon(heading || 0));
      }
      driverMap.panTo(currentLatLng, { animate: true });

      // Push to Firebase
      await setDoc(doc(db, "trips", currentTripId), {
        latitude: lat, longitude: lng, speed: speedKmh, accuracy: accMeters, heading: heading || 0, timestamp: Date.now(), updatedAt: serverTimestamp()
      }, { merge: true });
    }
  </script>
</body>
</html>
