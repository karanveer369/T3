<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Customer - GPS Live Tracking</title>
  
  <script src="https://tailwindcss.com"></script>
  <script> tailwind.config = { darkMode: 'class' } </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    .leaflet-container { font-family: inherit; width: 100%; height: 100%; background: #090d16; }
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .car-marker-container { transition: transform 0.2s linear; transform-origin: center center; }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden select-none">

  <div class="h-full flex flex-col relative w-full overflow-hidden">
    <header class="z-30 bg-slate-900/95 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-sky-400 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
          <i class="fa-solid fa-map-location-dot text-base"></i>
        </div>
        <div>
          <h1 class="font-bold text-base text-white flex items-center gap-1.5">
            RideTracker <span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300">Customer</span>
          </h1>
          <p class="text-xs text-slate-400">Live Vehicle Tracker</p>
        </div>
      </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col">
      <!-- Setup Screen -->
      <section id="setupView" class="absolute inset-0 z-50 flex flex-col justify-center items-center p-4 bg-slate-950">
        <div class="glass-panel w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-5">
          <div class="text-center space-y-2">
            <h2 class="text-2xl font-extrabold text-white">Track Vehicle</h2>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase mb-2">Trip ID to Track</label>
            <input type="text" id="sessionTripInput" value="trip_101" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm"/>
          </div>
          <button onclick="startApp()" class="w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-sky-600 hover:bg-sky-500 shadow-lg">
            Start Live Tracking
          </button>
        </div>
      </section>

      <!-- Dashboard -->
      <section id="customerView" class="hidden flex-1 flex flex-col relative h-full overflow-hidden">
        <div class="flex-1 relative w-full h-full">
          <div id="customerMap" class="w-full h-full absolute inset-0"></div>
          
          <div id="customerWaitingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-[1000] flex flex-col items-center justify-center text-center">
            <div class="w-14 h-14 rounded-2xl bg-sky-500/20 text-sky-400 flex items-center justify-center text-2xl mb-3 animate-pulse">
              <i class="fa-solid fa-tower-broadcast"></i>
            </div>
            <h3 class="text-lg font-bold text-white">Listening for Driver...</h3>
            <p class="text-xs text-slate-400 mt-1">Make sure Driver has started broadcasting.</p>
          </div>

          <div class="absolute top-3 left-3 z-[1000] glass-panel px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 text-white">
            <span id="customerConnDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="customerConnStatus">Connecting...</span>
          </div>
        </div>

        <div class="bg-slate-900 border-t border-slate-800 p-4 shadow-2xl space-y-3 z-20">
          <div class="flex justify-between items-center">
             <div class="flex items-center gap-3">
               <div class="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center text-base"><i class="fa-solid fa-taxi"></i></div>
               <div><h3 class="font-bold text-white text-sm">Vehicle Live Status</h3><p id="customerLastSeenText" class="text-[11px] text-slate-400">Waiting for updates...</p></div>
             </div>
          </div>

          <!-- Coordinates & Speed Grid -->
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="p-2 bg-slate-950/70 rounded-xl border border-slate-800"><span class="text-[9px] text-slate-400 font-bold block">Lat</span><p id="customerLatDisplay" class="text-xs font-mono text-white mt-0.5">--</p></div>
            <div class="p-2 bg-slate-950/70 rounded-xl border border-slate-800"><span class="text-[9px] text-slate-400 font-bold block">Lng</span><p id="customerLngDisplay" class="text-xs font-mono text-white mt-0.5">--</p></div>
            <div class="p-2 bg-slate-950/70 rounded-xl border border-slate-800"><span class="text-[9px] text-slate-400 font-bold block">Speed</span><p id="customerSpeedDisplay" class="text-xs font-mono text-emerald-400 mt-0.5">0 km/h</p></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const fbConf = {
      apiKey: "AIzaSyC_bj_Jxhi0ZzS_w4kkSv8Rn2GPRPx5H6o",
      authDomain: "adarsh-bal-vidya-mandir-d0bf9.firebaseapp.com",
      projectId: "adarsh-bal-vidya-mandir-d0bf9",
      storageBucket: "adarsh-bal-vidya-mandir-d0bf9.firebasestorage.app",
      messagingSenderId: "533739162741",
      appId: "1:533739162741:web:ca2cef802f5ba6588ebc3c"
    };

    let db = getFirestore(initializeApp(fbConf));
    let currentTripId = 'trip_101', customerMap = null, customerDriverMarker = null, customerRoutePolyline = null;
    let targetLat = 0, targetLng = 0, displayedLat = 0, displayedLng = 0;
    let customerRoutePoints = [];

    const createCarIcon = (heading = 0) => L.divIcon({
      className: '',
      html: `<div class="car-marker-container" style="transform: rotate(${heading}deg);"><div class="w-10 h-10 flex items-center justify-center bg-slate-900 text-sky-400 rounded-full border-2 border-sky-400 shadow-xl"><i class="fa-solid fa-car-side"></i></div></div>`,
      iconSize: [40, 40], iconAnchor: [20, 20]
    });

    window.startApp = function() {
      currentTripId = document.getElementById('sessionTripInput').value.trim() || 'trip_101';
      document.getElementById('setupView').classList.add('hidden');
      document.getElementById('customerView').classList.remove('hidden');
      
      setTimeout(() => {
        if (!customerMap) {
          customerMap = L.map('customerMap', { zoomControl: false }).setView([26.9739, 81.9098], 17);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(customerMap);
          customerRoutePolyline = L.polyline([], { color: '#0ea5e9', weight: 5 }).addTo(customerMap);
          
          startSmoothLoop();
          listenToDriverStream();
        } else {
          customerMap.invalidateSize();
        }
      }, 200);
    };

    function startSmoothLoop() {
      if (targetLat !== 0 && targetLng !== 0) {
        if (displayedLat === 0) { displayedLat = targetLat; displayedLng = targetLng; }
        
        displayedLat += (targetLat - displayedLat) * 0.2;
        displayedLng += (targetLng - displayedLng) * 0.2;

        const currentPos = [displayedLat, displayedLng];
        if (customerDriverMarker) {
          customerDriverMarker.setLatLng(currentPos);
        }
        customerMap.panTo(currentPos, { animate: true, duration: 0.5 });
      }
      requestAnimationFrame(startSmoothLoop);
    }

    function listenToDriverStream() {
      onSnapshot(doc(db, "trips", currentTripId), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('customerWaitingOverlay').classList.add('hidden');
          document.getElementById('customerConnDot').className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
          document.getElementById('customerConnStatus').textContent = "Connected";

          targetLat = data.latitude;
          targetLng = data.longitude;

          document.getElementById('customerLatDisplay').textContent = Number(targetLat).toFixed(4);
          document.getElementById('customerLngDisplay').textContent = Number(targetLng).toFixed(4);
          document.getElementById('customerSpeedDisplay').textContent = `${data.speed || 0} km/h`;
          document.getElementById('customerLastSeenText').textContent = "Live synced";

          const latlng = [targetLat, targetLng];
          if (!customerDriverMarker) {
            customerDriverMarker = L.marker(latlng, { icon: createCarIcon(data.heading || 0) }).addTo(customerMap);
            displayedLat = targetLat; displayedLng = targetLng;
            customerMap.setView(latlng, 17);
          } else {
            customerDriverMarker.setIcon(createCarIcon(data.heading || 0));
          }

          customerRoutePoints.push(latlng);
          customerRoutePolyline.setLatLngs(customerRoutePoints);
        }
      });
    }
  </script>
</body>
</html>
